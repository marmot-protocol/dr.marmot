name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '.github/lint/package-lock.json'

      - name: Install lint dependencies
        run: npm ci
        working-directory: .github/lint

      - name: Run ESLint
        id: eslint
        run: |
          npm run -s lint > eslint_report.txt || echo "lint_failed=true" >> $GITHUB_ENV
        working-directory: .github/lint

      - name: Comment PR with lint results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = '.github/lint/eslint_report.txt';
            if (!fs.existsSync(reportPath)) return;
            
            let report = fs.readFileSync(reportPath, 'utf8').trim();
            if (!report) return;
            
            if (report.length > 60000) {
              report = report.substring(0, 60000) + '\n... [truncated]';
            }
            const body = `## 🚨 ESLint Found Issues\n\n\`\`\`text\n${report}\n\`\`\``;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes('ESLint Found Issues')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if lint failed
        if: env.lint_failed == 'true'
        run: exit 1
